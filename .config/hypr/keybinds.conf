# ========================================
# SYSTEM
# ========================================
bind = SUPER, M, exec, kitty --title sysmenu -e sysmenu
bind = CTRL+ALT, Delete, exec, kitty --title sysmenu -e sysmenu
bind = SUPER, SUPER_L, exec, pkill puffy || kitty --title puffy -e puffy
bind = SUPER, Q, killactive
bind = SUPER, L, exec, tlock

# ========================================
# SHELL
# ========================================
bind = SUPER SHIFT, R, exec, sh -c "~/.local/bin/relaunch_shell"
bind = SUPER, N, exec, kitty --title leftpanel -e "/home/jless/.config/scripts/panel"

# ========================================
# MEDIA KEYS
# ========================================
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

bind = , XF86AudioPlay, exec, playerctl play-pause
bind = Super+Shift, P, exec, playerctl play-pause

bind = , XF86AudioNext, exec, playerctl next
bind = Super+Shift, N, exec, playerctl next

bind = , XF86AudioPrev, exec, playerctl previous

bind = , XF86MonBrightnessUp, exec, brightnessctl set +10%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 10%-

# ========================================
# WINDOW MANAGEMENT — mirrors TwmAction dispatch
# ========================================

# TwmAction::FocusLeft/Right/Up/Down — directional spatial focus
# Uses focus_dir() which finds nearest pane in that direction
bind = Super, Left,  movefocus, l
bind = Super, Right, movefocus, r
bind = Super, Up,    movefocus, u
bind = Super, Down,  movefocus, d
bind = Super, H,     movefocus, l
bind = Super, L,     movefocus, r
bind = Super, K,     movefocus, u
bind = Super, J,     movefocus, d

# TwmAction::MoveLeft/Right/Up/Down — swap_focused() in workspace
bind = Super+Shift, Left,  movewindow, l
bind = Super+Shift, Right, movewindow, r
bind = Super+Shift, Up,    movewindow, u
bind = Super+Shift, Down,  movewindow, d
bind = Super+Shift, H,     movewindow, l
bind = Super+Shift, L,     movewindow, r
bind = Super+Shift, K,     movewindow, u
bind = Super+Shift, J,     movewindow, d

# Move floating window — TwmAction::FloatMove
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, Z, movewindow

# Resize floating window — TwmAction::FloatResize
bindm = super, mouse:273, resizewindow
bindm = super, X, resizewindow

# TwmAction::GrowMain / ShrinkMain — ws.main_ratio ±0.05
binde = Super, Semicolon,  splitratio, -0.05
binde = Super, Apostrophe, splitratio, +0.05

# TwmAction::ToggleFloat
bind = Super+Alt, Space, togglefloating

# TwmAction::Fullscreen (fullscreen=1 = maximise keeping bar, matching
# p.fullscreen = true → rect = screen_rect in twm/mod.rs)
bind = Super, D, fullscreen, 1

# True fullscreen (rect = Rect::new(0,0,screen_w,screen_h))
bind = Super, F, fullscreen, 0

# TwmAction::NextLayout / PrevLayout
# Cycle: Bsp → Columns → Rows → ThreeCol → Monocle → Bsp
bind = Super, Tab,       layoutmsg, cyclenext    # NextLayout
bind = Super+Shift, Tab, layoutmsg, cycleprev    # PrevLayout

# Toggle dwindle split direction (mirrors bsp_inner vertical/horizontal flip)
# togglesplit dispatcher was removed — use layoutmsg instead
bind = Super+Shift, Apostrophe, layoutmsg, togglesplit

# ── Resize submap — matches twm InputMode::Resize ─────────────────────────────
bind = Super, R, submap, resize

submap = resize
binde = , H,     resizeactive, -40  0
binde = , L,     resizeactive,  40  0
binde = , K,     resizeactive,   0 -20
binde = , J,     resizeactive,   0  20
binde = , left,  resizeactive, -40  0
binde = , right, resizeactive,  40  0
binde = , up,    resizeactive,   0 -20
binde = , down,  resizeactive,   0  20
bind  = , Escape, submap, reset
bind  = , Return, submap, reset
submap = reset

# ========================================
# WORKSPACES — TwmAction::Workspace / MoveToWorkspace
# ========================================
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9

bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9

# TwmAction::NextWorkspace / PrevWorkspace
bind = SUPER+CTRL, Right, workspace, r+1
bind = SUPER+CTRL, Left,  workspace, r-1

# ========================================
# SPECIAL WORKSPACES — TwmAction::ToggleScratchpad
# Matches TwmState::toggle_scratchpad: drop from top, fly back up
# Sizes from Scratchpad::with_size() defaults (0.6 × 0.6 of screen)
# ========================================
bind = SUPER CTRL, D, togglespecialworkspace, Disc
bind = SUPER CTRL, M, togglespecialworkspace, yt
bind = SUPER, B, togglespecialworkspace, btop
bind = SUPER, G, togglespecialworkspace, git

# ========================================
# SCREENSHOTS & UTILITIES
# ========================================
bind = SUPER SHIFT, S, exec, grimblast copy area

bind = SUPER, Slash, exec, kitty --class=floating-cheatsheet -e /usr/local/bin/cheatsheet
bind = SUPER, V, exec, kitty --class=floating-clipboard -e ~/.local/bin/clipview

# ========================================
# APPLICATIONS — TwmAction::OpenShell
# ========================================
bind = SUPER SHIFT, D, exec, dolphin
bind = SUPER, T, exec, kitty
bind = SUPER, E, exec, kitty -e yazi
bind = SUPER, C, exec, kitty -e nvim
