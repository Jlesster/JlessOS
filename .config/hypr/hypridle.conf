general {
    lock_cmd = pidof hyprlock || hyprlock   # avoid multiple hyprlock instances
    unlock_cmd = pkill -USR1 hyprlock       # wake hyprlock on unlock signal
    before_sleep_cmd = loginctl lock-session # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on # turn screen back on after wake
    ignore_dbus_inhibit = false             # respect apps that inhibit idle (e.g. Firefox, Steam)
    ignore_systemd_inhibit = false          # respect systemd inhibitors
}

# Dim screen after 4.5 minutes of inactivity
listener {
    timeout = 270                           # 4.5 min
    on-timeout = brightnessctl -s set 20%  # save brightness and dim to 20%
    on-resume = brightnessctl -r            # restore saved brightness
}

# Lock screen after 5 minutes of inactivity
listener {
    timeout = 300                           # 5 min
    on-timeout = loginctl lock-session      # trigger lock via logind (fires lock_cmd above)
    on-resume =                             # nothing needed; hyprlock handles unlock
}

# Turn off displays after 5.5 minutes (30s after lock)
listener {
    timeout = 330                           # 5.5 min
    on-timeout = hyprctl dispatch dpms off  # turn off displays
    on-resume = hyprctl dispatch dpms on    # turn displays back on on activity
}

# Suspend system after 30 minutes of inactivity
listener {
    timeout = 1800                          # 30 min
    on-timeout = systemctl suspend          # suspend the system
}
