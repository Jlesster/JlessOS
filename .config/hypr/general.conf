gesture = 3, swipe, move,
gesture = 3, pinch, float
gesture = 4, horizontal, workspace
gesture = 4, up, dispatcher, global, quickshell:overviewWorkspacesToggle
gesture = 4, down, dispatcher, global, quickshell:overviewWorkspacesClose

gestures {
    workspace_swipe_distance = 700
    workspace_swipe_cancel_ratio = 0.2
    workspace_swipe_min_speed_to_force = 5
    workspace_swipe_direction_lock = true
    workspace_swipe_direction_lock_threshold = 10
    workspace_swipe_create_new = true
}

general {
    gaps_in  = 4
    gaps_out = 4
    border_size = 2
    col.active_border   = rgb(cba6f9)
    col.inactive_border = rgba(45475aff)
    layout = dwindle
}

dwindle {
    preserve_split  = true
    smart_split     = false
    smart_resizing  = false
    force_split     = 2
}

decoration {
    rounding = 0

    active_opacity   = 1.0
    inactive_opacity = 1.0

    # Current syntax: blur and shadow are nested blocks inside decoration
    # Old syntax (drop_shadow = no, blur_new_optimizations etc.) is removed
    blur {
        enabled = false
    }

    shadow {
        enabled = false
    }
}

animations {
    enabled = true

    # ease_out_quint — matches anim.rs open/morph (200ms)
    bezier = twm_open,  0.23, 1.0, 0.32, 1.0
    # ease_in_cubic — matches anim.rs close (150ms)
    bezier = twm_close, 0.55, 0.0, 1.0, 1.0
    # ease_out_quint for workspace slide (240ms)
    bezier = twm_ws,    0.23, 1.0, 0.32, 1.0

    animation = windowsIn,   1, 2, twm_open,  slide
    animation = windowsOut,  1, 2, twm_close, slide
    animation = windowsMove, 1, 2, twm_open
    animation = workspaces,  1, 2, twm_ws,    slide
    animation = fade,        1, 2, twm_open
    animation = border,      1, 1, twm_open
}

misc {
    disable_hyprland_logo    = true
    disable_splash_rendering = true
    background_color         = rgba(1e1e2eff)
    animate_manual_resizes        = false
    animate_mouse_windowdragging  = false
    force_default_wallpaper  = 0
}

# render is a top-level section (was misc:no_direct_scanout in old syntax)
render {
    direct_scanout = false
}

input {
    kb_layout = gb
    follow_mouse = 1

    touchpad {
        natural_scroll = yes
        scroll_factor  = 0.7
    }
}
