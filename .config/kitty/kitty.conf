font_size 		13

confirm_os_window_close	0

shell fish
cursor_trail 1
background_opacity 1.0 
dynamic_background_opacity yes


map ctrl+shift+o set_background_opacity 1.0
map ctrl+shift+p set_background_opacity 0.65


text_composition_strategy 2.0 10
adjust_column_width 1

# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME


# BEGIN_KITTY_FONTS
font_family      family='IosevkaJlessBrains Nerd Font' postscript_name=IosevkaJlessBrainsNF
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
